<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0b11; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; }
  .og__photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 42%;
  }
  .og__veil {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(8,9,14,0.78) 0%, rgba(8,9,14,0.55) 34%,
      rgba(8,9,14,0.12) 60%, rgba(8,9,14,0.0) 80%);
  }
  .og__veil-bottom {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(8,9,14,0.35) 0%, rgba(8,9,14,0.0) 30%);
  }
  .og__text { position: absolute; left: 84px; bottom: 76px;
    display: flex; flex-direction: column; align-items: flex-start; }
  .og__kicker {
    font-family: Pretendard, sans-serif; font-size: 26px; font-weight: 600;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: rgba(255,255,255,0.82); margin-bottom: 22px; padding-left: 4px;
  }
  .og__kicker::before {
    content: ""; display: inline-block; width: 46px; height: 2px;
    vertical-align: middle; background: #e8b06a; margin-right: 18px;
    transform: translateY(-5px);
  }
  .og__title {
    font-family: "Playfair Display", serif; font-size: 132px; font-weight: 600;
    line-height: 0.94; color: #fff; letter-spacing: -0.01em;
    text-shadow: 0 6px 30px rgba(0,0,0,0.45);
  }
  .og__sub {
    font-family: Pretendard, sans-serif; font-size: 40px; font-weight: 400;
    line-height: 1.2; color: rgba(255,255,255,0.92); margin-top: 26px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="og">
    <img class="og__photo" src="../main/main_bg.webp" alt="" />
    <div class="og__veil"></div>
    <div class="og__veil-bottom"></div>
    <div class="og__text">
      <div class="og__kicker">JIWON SEO</div>
      <div class="og__title">Portfolio</div>
      <div class="og__sub">Designing worlds worth staying in.</div>
    </div>
  </div>
</body>
</html>
